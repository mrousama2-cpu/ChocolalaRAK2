<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>طلبية المصنع</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="طلبية">
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f5f1;--card:#fff;--tx:#1d2320;--mut:#6b736e;--ac:#1f6f50;--acx:#fff;--bd:#e0ddd4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151816;--card:#1e2320;--tx:#ecefed;--mut:#939b96;--ac:#3fb98a;--acx:#0b1a13;--bd:#2d3430}}
:root[data-theme="dark"]{--bg:#151816;--card:#1e2320;--tx:#ecefed;--mut:#939b96;--ac:#3fb98a;--acx:#0b1a13;--bd:#2d3430}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;padding:14px 12px 90px;max-width:720px;margin-inline:auto}
h1{font-size:20px;margin:4px 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px;margin-bottom:10px}
summary{font-weight:700;cursor:pointer;padding:2px 0}
input,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:8px 9px;width:100%;min-width:0}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.g label{font-size:12px;color:var(--mut);display:block;margin-bottom:2px}
.row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.item{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--bd)}
.nm{flex:1;min-width:0;direction:ltr;text-align:left}.nm b{display:block;font-size:14px;line-height:1.3}.nm small{color:var(--mut)}
.add{min-width:64px;height:36px;border-radius:10px;border:1px solid var(--ac);background:transparent;color:var(--ac);font:inherit;font-weight:700}
.badge{background:var(--ac);color:var(--acx);border-radius:9px;padding:0 6px;font-size:12px;margin-inline-start:4px}
.ln{border:1px solid var(--bd);border-radius:12px;padding:8px;margin-top:8px}
.ln .t{display:flex;gap:8px;align-items:flex-start;direction:ltr;text-align:left;font-size:13px;font-weight:600}
.ln .t span{flex:1}
.ln .x{border:0;background:transparent;color:var(--mut);font-size:18px}
.ln .g{grid-template-columns:70px 80px 1fr;margin-top:6px}
.ln .n{margin-top:6px}
.btn{background:var(--ac);color:var(--acx);border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:700}
.bar{position:fixed;inset-inline:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--bd);display:flex;gap:10px;align-items:center}
.bar .btn{flex:1}
.th{width:52px;height:52px;object-fit:cover;border-radius:8px;border:1px solid var(--bd);background:var(--bg);flex:none;cursor:zoom-in}
.chk{display:flex;gap:6px;align-items:center;font-size:14px;margin-top:8px}.chk input{width:auto}
.msg{font-size:13px;color:var(--mut)}
.more{width:100%;margin-top:8px;background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
</style>
</head>
<body>
<h1>📦 طلبية المصنع</h1>

<details class="card" open>
  <summary>بيانات الطلب</summary>
  <div class="g">
    <div><label>Branch</label><input id="h_branch"></div>
    <div><label>Delivery Date</label><input id="h_dd" type="date"></div>
    <div><label>Order Date</label><input id="h_od" type="date"></div>
    <div><label>Priority</label><input id="h_pr"></div>
    <div><label>Order Type</label><input id="h_ot" value="SHOP Order"></div>
    <div><label>Delivery Location</label><input id="h_loc"></div>
    <div><label>Branch Manager</label><input id="h_bm"></div>
    <div><label>Area Manager</label><input id="h_am"></div>
  </div>
</details>

<details class="card" open>
  <summary>طلبك (<span id="lc">0</span>)</summary>
  <div id="lines"><div class="msg" style="padding:8px 0">اضغط «إضافة» بجانب أي صنف ليظهر هنا.</div></div>
</details>

<div class="card">
  <div class="row"><input id="s" placeholder="🔍 بحث بالاسم أو الكود"></div>
  <div class="row"><select id="cat"></select></div>
  <div class="msg" id="info"></div>
  <div id="list"></div>
  <button class="btn more" id="more" style="display:none" onclick="lim+=60;render()">عرض المزيد</button>
</div>

<label class="chk" style="padding:0 4px"><input type="checkbox" id="wimg"> إدراج صور الأصناف في ملف Excel (عمود Image)</label>
<div class="bar">
  <div style="white-space:nowrap"><b id="cnt">0</b> <span class="msg">سطر</span></div>
  <button class="btn" onclick="exp()">تصدير الطلب إلى Excel</button>
</div>

var L=[],lim=60;
var $=function(i){return document.getElementById(i)};
function esc(t){var d=document.createElement("div");d.textContent=t;return d.innerHTML}
function ea(t){return esc(t).replace(/"/g,"&quot;")}
var cs={};P.forEach(function(p){cs[p[3]]=(cs[p[3]]||0)+1});
var cats=Object.keys(cs).sort(function(a,b){return cs[b]-cs[a]});
$("cat").innerHTML='<option value="">كل الأقسام ('+P.length+')</option>'+cats.map(function(c){return '<option value="'+ea(c)+'">'+esc(c)+' ('+cs[c]+')</option>'}).join("");

function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
$("h_od").value=iso(new Date());
var HF=["branch","pr","ot","loc","bm","am"];
try{var sv=JSON.parse(localStorage.getItem("fo_h")||"{}");HF.forEach(function(k){if(sv[k])$("h_"+k).value=sv[k]})}catch(e){}
HF.forEach(function(k){$("h_"+k).addEventListener("input",function(){try{var o={};HF.forEach(function(x){o[x]=$("h_"+x).value});localStorage.setItem("fo_h",JSON.stringify(o))}catch(e){}})});

function render(){
  var f=$("s").value.trim().toLowerCase(),c=$("cat").value,m=[];
  for(var i=0;i<P.length;i++){var p=P[i];
    if(c&&p[3]!==c)continue;
    if(f&&(p[1]+" "+p[0]).toLowerCase().indexOf(f)<0)continue;m.push(i)}
  var n={};L.forEach(function(l){n[l.code]=(n[l.code]||0)+1});
  var h="";m.slice(0,lim).forEach(function(i){var p=P[i];
    h+='<div class="item">'+im(p)+'<div class="nm"><b>'+esc(p[1])+(n[p[0]]?'<span class="badge">'+n[p[0]]+'</span>':'')+'</b><small>'+esc(p[0])+' · '+esc(p[2])+(p[4]?' · '+esc(p[4]):'')+'</small></div><button class="add" onclick="addL('+i+')">+ إضافة</button></div>'});
  $("list").innerHTML=h||'<div class="msg" style="padding:10px">لا توجد نتائج</div>';
  $("more").style.display=m.length>lim?"block":"none";
  $("info").textContent="النتائج: "+m.length;
}
function im(p){return p[5]?'<img class="th" loading="lazy" src="images/'+encodeURIComponent(p[5])+'" onclick="window.open(this.src)" onerror="this.style.visibility=\'hidden\'">':'<div class="th"></div>'}
function addL(i){var p=P[i];L.push({code:p[0],name:p[1],unit:p[2],flav:p[4],img:p[5],qty:1,note:""});lines();render()}
function delL(k){L.splice(k,1);lines();render()}
function upd(k,f,v){L[k][f]=f==="qty"?(parseFloat(v)||0):v}
function lines(){
  var h="";L.forEach(function(l,k){
    h+='<div class="ln"><div class="t">'+(l.img?'<img class="th" src="images/'+encodeURIComponent(l.img)+'" onerror="this.style.visibility=\'hidden\'">':'')+'<span>'+esc(l.code)+' — '+esc(l.name)+'</span><button class="x" onclick="delL('+k+')">✕</button></div>'
     +'<div class="g"><div><label>Qty</label><input type="number" min="0" inputmode="decimal" value="'+l.qty+'" oninput="upd('+k+',\'qty\',this.value)"></div>'
     +'<div><label>Unit</label><input value="'+ea(l.unit)+'" oninput="upd('+k+',\'unit\',this.value)"></div>'
     +'<div><label>Flavour</label><input value="'+ea(l.flav)+'" oninput="upd('+k+',\'flav\',this.value)"></div></div>'
     +'<input class="n" placeholder="Note" value="'+ea(l.note)+'" oninput="upd('+k+',\'note\',this.value)"></div>'});
  $("lines").innerHTML=h||'<div class="msg" style="padding:8px 0">اضغط «إضافة» بجانب أي صنف ليظهر هنا.</div>';
  $("lc").textContent=L.length;$("cnt").textContent=L.length;
}
function fd(v){if(!v)return"";var a=v.split("-");return (+a[1])+"/"+(+a[2])+"/"+a[0].slice(2)}

async function thumb(fn){
  try{var r=await fetch('images/'+encodeURIComponent(fn));var b=await r.blob();var bm=await createImageBitmap(b);
    var s=Math.min(1,150/Math.max(bm.width,bm.height)),cv=document.createElement('canvas');cv.width=Math.round(bm.width*s);cv.height=Math.round(bm.height*s);
    cv.getContext('2d').drawImage(bm,0,0,cv.width,cv.height);return{b64:cv.toDataURL('image/jpeg',0.8),w:cv.width,h:cv.height}}catch(e){return null}
}
async function exp(){
  if(!L.length){alert("أضف صنفاً واحداً على الأقل");return}
  var F="Times New Roman",B={style:"medium"},bd={top:B,left:B,bottom:B,right:B};
  var wb=new ExcelJS.Workbook(),ws=wb.addWorksheet("Order",{pageSetup:{orientation:"portrait",fitToPage:true,fitToWidth:1,fitToHeight:0}});
  [6,14,42,12,10,24,24,22].forEach(function(w,i){ws.getColumn(i+1).width=w});
  var mid={horizontal:"center",vertical:"middle",wrapText:true};
  function put(a,v,sz,extra){var c=ws.getCell(a);c.value=v;c.font=Object.assign({name:F,bold:true,size:sz||13},extra||{});c.alignment=mid}
  ws.mergeCells("A1:B2");put("A1","CHOCOLALA",16,{color:{argb:"FFB8860B"}});
  ws.mergeCells("C1:G2");put("C1","CHOCOLATE  REQUEST FORM",26);
  ws.getRow(1).height=30;ws.getRow(2).height=30;
  function hdr(r,l1,v1,l2,v2){
    ws.mergeCells("A"+r+":B"+r);ws.mergeCells("D"+r+":E"+r);ws.mergeCells("F"+r+":G"+r);
    put("A"+r,l1);put("C"+r,v1);put("D"+r,l2);put("F"+r,v2);ws.getRow(r).height=26}
  hdr(3,"Branch",$("h_branch").value,"Delivery Date",fd($("h_dd").value));
  hdr(4,"Order Date",fd($("h_od").value),"Priority",$("h_pr").value);
  hdr(5,"Order Type",$("h_ot").value,"Delivery Location",$("h_loc").value);
  hdr(6,"Branch Manager",$("h_bm").value,"Area Manager",$("h_am").value);
  ["SQ","Item Code","Item Name","Quantity","Unit","Flavour","Note"].forEach(function(t,i){put(String.fromCharCode(65+i)+"7",t,14)});
  ws.getRow(7).height=28;
  L.forEach(function(l,k){var r=8+k;
    var code=/^\d+$/.test(l.code)?Number(l.code):l.code;
    var vals=[k+1,code,l.name,l.qty,l.unit,l.flav,l.note];
    vals.forEach(function(v,i){put(String.fromCharCode(65+i)+r,v,i===2?12:13,i===2||i===1?{bold:false}:null)});
    ws.getRow(r).height=38});
  var last=7+L.length,wi=$("wimg").checked,nc=wi?8:7;
  if(wi){put("H7","Image",14);
    for(var k=0;k<L.length;k++){var r=8+k;ws.getRow(r).height=90;ws.getCell("H"+r).alignment=mid;
      if(!L[k].img)continue;var t=await thumb(L[k].img);if(!t)continue;
      var sc=Math.min(1,100/t.h,120/t.w),id=wb.addImage({base64:t.b64,extension:"jpeg"});
      ws.addImage(id,{tl:{col:7.08,row:r-1+0.06},ext:{width:t.w*sc,height:t.h*sc}})}}
  for(var r=1;r<=last;r++)for(var c=1;c<=nc;c++){if(c===8&&r<7)continue;ws.getCell(r,c).border=bd}
  var buf=await wb.xlsx.writeBuffer();
  var ds=iso(new Date());
  try{
    var bl=new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
    var dl=window.claude&&await window.claude.use("downloads");
    if(dl){await dl.save({filename:"Order-"+ds+".xlsx",data:bl})}
    else{var a=document.createElement("a");a.href=URL.createObjectURL(bl);a.download="Order-"+ds+".xlsx";document.body.appendChild(a);a.click();a.remove()}
  }catch(e){if(!e||e.code!=="declined")alert("تعذر حفظ الملف")}
}
$("s").addEventListener("input",function(){lim=60;render()});
$("cat").addEventListener("change",function(){lim=60;render()});
render();
</script>
